<li>Collabora con il Paziente e i suoi familiari nell’organizzazione del trattamento dialitico presso gli Ambulatori vacanze</li><li>Collabora con i Medici nell’informare il Paziente e i suoi familiari dell’esistenza di programmi di trapianto</li><li>In collaborazione con il personale tecnico: controlla che tutte le dotazioni strumentali dell’Ambulatorio siano efficienti così come gli impianti tecnologici utilizzati nel procedimento dialitico.</li><li>Controlla la qualità dell’acqua di dialisi</li><li>Supervisiona tutte quelle attività richieste per mantenere l’Ambulatorio a standard elevati, come l’implementazione dei protocolli e delle procedure controllandone i risultati</li><li>Assicura tutte le azioni necessarie a garantire il rispetto delle norme igieniche ed il controllo delle infezioni, in accordo con le Linee Guida sulle Best Practice Europee (EBPG) garantendo, altresì, l’implementazione e l’utilizzo di idonee misure protettive</li></ul><p> </p><p><b>SKILLS</b></p><ul><li>Abilità nel ruolo assistenziale e nell'interazione con il paziente</li><li>Capacità di lavoro in team</li><li>Attitudine digitale</li><li>Predisposizione alla formazione continua</li></ul><p> </p><p><i>Valutiamo con attenzione e rispetto tutte le candidature, comprese quelle presentate da persone con disabilità (Legge 68/99).</i><br /><i>Ci impegniamo a garantire un ambiente di lavoro inclusivo e, dove necessario, a offrire adeguamenti ragionevoli per consentire a tutti i candidati di partecipare al processo di selezione e, successivamente, di svolgere il proprio ruolo.</i></p><p> </p></div>","identifier":{"@type":"PropertyValue","name":"Fresenius Medical Care","value":"R0277021"},"datePosted":"2026-11-12T12:41:37.415621+00:00","employmentType":["FULL_TIME"],"hiringOrganization":{"@type":"Organization","name":"Fresenius Medical Care","sameAs":"https://fmcna.com/","logo":"https://dokumfe7mps0i.cloudfront.net/oms/15787/image/2024/12/5EKHD_google/google.jpg"},"jobLocation":[{"@type":"Place","
